apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: default
  labels:
    app: devops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: devops-app
          image: gabconst/devops-app:v1
          imagePullPolicy: Always
          env:
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: devops-app-config
                  key: APP_PORT
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: devops-app-config
                  key: APP_NAME
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10