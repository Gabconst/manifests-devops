apiVersion: v1
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include          /etc/nginx/mime.types;
        default_type     application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile         on;
        keepalive_timeout  65;

        # 1. Adicione o resolvedor DNS do Kubernetes
        # O IP 10.96.0.10 é o ClusterIP do Service do coredns/kube-dns
        resolver 10.96.0.10 valid=5s; 

        # --- UPSTREAMS CORRIGIDOS ---

        upstream grafana {
            # CORREÇÃO: Usa apenas o FQDN e a diretiva 'resolve'.
            # O NGINX irá consultar o DNS (10.96.0.10) e usar a porta definida no proxy_pass.
            server grafana-service.default.svc.cluster.local resolve; 
        }

        upstream prometheus {
            # CORREÇÃO: Sintaxe idêntica para o Prometheus.
            server prometheus-service.default.svc.cluster.local resolve;
        }

        # --- BLOCO SERVER ---

        server {
            listen 80;
            server_name localhost;

            # Rota para Grafana
            location /grafana/ {
                # CORREÇÃO: Usa o nome do upstream (grafana) E A PORTA (3000)
                # O 'proxy_pass http://grafana:3000' usa o upstream definido acima e adiciona a porta de destino.
                proxy_pass http://grafana:3000;
            }

            # Rota para Prometheus
            location /prometheus/ {
                # CORREÇÃO: Usa o nome do upstream (prometheus) E A PORTA (9090)
                proxy_pass http://prometheus:9090;
            }
        }
    }
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: nginx:/ConfigMap:default/nginx-config
  name: nginx-config
  namespace: default