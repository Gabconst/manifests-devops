apiVersion: v1
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include          /etc/nginx/mime.types;
        default_type     application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile         on;
        keepalive_timeout  65;

        # LINHA CORRIGIDA: Uso correto da diretiva 'resolver' (com R)
        resolver 10.96.0.10 valid=5s; 

        # --- UPSTREAMS CORRIGIDOS ---

        upstream grafana {
            # CORREÇÃO DE SINTAXE: Usa apenas o FQDN do Service e a diretiva 'resolve'
            server grafana-service.default.svc.cluster.local resolve; 
        }

        upstream prometheus {
            # CORREÇÃO DE SINTAXE: FQDN e 'resolve'
            server prometheus-service.default.svc.cluster.local resolve;
        }

        # --- BLOCO SERVER (Reverse Proxy) ---

        server {
            listen 80;
            server_name localhost;

            location /grafana/ {
                # CORREÇÃO 404: Usa o nome do upstream + a porta do Service (3000)
                proxy_pass http://grafana:3000;
            }

            location /prometheus/ {
                # CORREÇÃO 404: Usa o nome do upstream + a porta do Service (9090)
                proxy_pass http://prometheus:9090;
            }
        }
    }
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: nginx:/ConfigMap:default/nginx-config
  name: nginx-config
  namespace: default