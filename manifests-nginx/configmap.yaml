apiVersion: v1
data:
  nginx.conf: |
    # ... (Configurações globais omitidas) ...
    http {
        # ... (Diretivas http omitidas) ...

        server {
            listen 80;
            server_name localhost;

            location /grafana/ {
                # Roteamento interno correto
                proxy_pass http://grafana-service.default.svc.cluster.local:3000;

                proxy_redirect ~^/login(.*)$ /grafana/login$1; 
                
                # proxy_redirect default; <-- REMOVIDA PARA EVITAR CONFLITO.
                
                # Informa o host correto e a URL real (essencial para subcaminhos)
                proxy_set_header Host $host; 
                proxy_set_header X-Real-URL $scheme://$host:$server_port/grafana;
            }

            location /prometheus/ {
                proxy_pass http://prometheus-service.default.svc.cluster.local:9090;
                proxy_set_header Host $host;
            }
        }
    }
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default