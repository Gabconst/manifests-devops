apiVersion: v1
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include          /etc/nginx/mime.types;
        default_type     application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile         on;
        keepalive_timeout  65;

        server {
            listen 80;
            server_name localhost;

            location /grafana/ {
                # Roteia para o Serviço Grafana (porta 3000)
                proxy_pass http://grafana-service.default.svc.cluster.local:3000;
            }

            location /prometheus/ {
                # Roteia para o Serviço Prometheus (porta 9090)
                proxy_pass http://prometheus-service.default.svc.cluster.local:9090;
            }
        }
    }
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default