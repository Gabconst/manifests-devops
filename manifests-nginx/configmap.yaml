apiVersion: v1
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include          /etc/nginx/mime.types;
        default_type     application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile         on;
        keepalive_timeout  65;

        # 1. Adicione o resolvedor DNS do Kubernetes (melhor prática)
        resolver 10.96.0.10 valid=5s; 

        upstream grafana {
            # CORRIGIDO: O nome do serviço FQDN (Full Qualified Domain Name)
            # A porta deve ser removida daqui para usar 'resolve'
            server grafana-service.default.svc.cluster.local resolve; 
        }

        upstream prometheus {
            # CORRIGIDO: Nome do serviço FQDN
            server prometheus-service.default.svc.cluster.local resolve;
        }

        server {
            listen 80;
            server_name localhost;

            location /grafana/ {
                # CORRIGIDO: Usa o nome do upstream e a porta do Serviço (3000)
                proxy_pass http://grafana:3000;
            }

            location /prometheus/ {
                # CORRIGIDO: Usa o nome do upstream e a porta do Serviço (9090)
                proxy_pass http://prometheus:9090;
            }
        }
    }
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: nginx:/ConfigMap:default/nginx-config
  name: nginx-config
  namespace: default